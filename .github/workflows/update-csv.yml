name: Update bundled CSV

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run update-csv

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update bundled holidays CSV"
          branch: chore/update-holidays-csv
          base: main
          title: "chore: update bundled holidays CSV"
          body: |
            内閣府の公式 CSV を取得し、`data/syukujitsu.csv` を更新しました。
          add-paths: data/syukujitsu.csv
